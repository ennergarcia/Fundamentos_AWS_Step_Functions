<svg viewBox="0 0 980 420" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="980" height="420" fill="#0E1B2B"/>

  <defs>
    <marker id="arrowS1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#FF9900"/>
    </marker>
  </defs>

  <!-- Start -->
  <circle cx="70" cy="90" r="30" fill="#232F3E" stroke="#4CAF50" stroke-width="2"/>
  <text x="70" y="95" fill="#FFFFFF" font-size="12" text-anchor="middle">Start</text>

  <line x1="100" y1="90" x2="170" y2="90" stroke="#FF9900" stroke-width="2" marker-end="url(#arrowS1)"/>

  <!-- Task: Glue Job -->
  <rect x="170" y="50" width="170" height="80" rx="10" fill="#232F3E" stroke="#FF9900" stroke-width="2"/>
  <text x="255" y="80" fill="#FFFFFF" font-size="13" text-anchor="middle">Task: RodarGlueJob</text>
  <text x="255" y="98" fill="#B0B8C1" font-size="11" text-anchor="middle">processa transações</text>
  <text x="255" y="113" fill="#B0B8C1" font-size="11" text-anchor="middle">Retry: 2x se falhar</text>

  <line x1="340" y1="90" x2="410" y2="90" stroke="#FF9900" stroke-width="2" marker-end="url(#arrowS1)"/>

  <!-- Task: Lambda validação -->
  <rect x="410" y="50" width="170" height="80" rx="10" fill="#232F3E" stroke="#FF9900" stroke-width="2"/>
  <text x="495" y="80" fill="#FFFFFF" font-size="13" text-anchor="middle">Task: ValidarQualidade</text>
  <text x="495" y="98" fill="#B0B8C1" font-size="11" text-anchor="middle">Lambda checa métricas</text>
  <text x="495" y="113" fill="#B0B8C1" font-size="11" text-anchor="middle">Catch: vai pra TratarErro</text>

  <line x1="495" y1="130" x2="495" y2="180" stroke="#FF9900" stroke-width="2" marker-end="url(#arrowS1)"/>

  <!-- Choice -->
  <polygon points="495,180 570,225 495,270 420,225" fill="#232F3E" stroke="#4B90FF" stroke-width="2"/>
  <text x="495" y="220" fill="#FFFFFF" font-size="12" text-anchor="middle">Choice:</text>
  <text x="495" y="236" fill="#B0B8C1" font-size="11" text-anchor="middle">qualidade OK?</text>

  <line x1="570" y1="225" x2="650" y2="225" stroke="#4CAF50" stroke-width="2" marker-end="url(#arrowS1)"/>
  <text x="610" y="212" fill="#4CAF50" font-size="10" text-anchor="middle">sim</text>

  <!-- Parallel -->
  <rect x="650" y="150" width="190" height="150" rx="10" fill="#232F3E" stroke="#4CAF50" stroke-width="2"/>
  <text x="745" y="172" fill="#FFFFFF" font-size="13" text-anchor="middle">Parallel</text>
  <rect x="670" y="185" width="150" height="45" rx="6" fill="#1A2739" stroke="#4CAF50" stroke-width="1"/>
  <text x="745" y="212" fill="#B0B8C1" font-size="11" text-anchor="middle">Atualizar Data Catalog</text>
  <rect x="670" y="240" width="150" height="45" rx="6" fill="#1A2739" stroke="#4CAF50" stroke-width="1"/>
  <text x="745" y="267" fill="#B0B8C1" font-size="11" text-anchor="middle">Notificar via SNS</text>

  <line x1="420" y1="225" x2="340" y2="225" stroke="#E05555" stroke-width="2" marker-end="url(#arrowS1)"/>
  <text x="380" y="212" fill="#E05555" font-size="10" text-anchor="middle">não</text>

  <!-- Fail path -->
  <rect x="170" y="185" width="170" height="80" rx="10" fill="#232F3E" stroke="#E05555" stroke-width="2"/>
  <text x="255" y="215" fill="#FFFFFF" font-size="13" text-anchor="middle">Task: TratarErro</text>
  <text x="255" y="233" fill="#B0B8C1" font-size="11" text-anchor="middle">notifica time via SNS</text>
  <text x="255" y="248" fill="#B0B8C1" font-size="11" text-anchor="middle">registra no DynamoDB</text>

  <line x1="255" y1="265" x2="255" y2="330" stroke="#E05555" stroke-width="2" marker-end="url(#arrowS1)"/>

  <!-- End states -->
  <circle cx="255" cy="360" r="28" fill="#232F3E" stroke="#E05555" stroke-width="2"/>
  <text x="255" y="365" fill="#FFFFFF" font-size="11" text-anchor="middle">Fail</text>

  <line x1="745" y1="300" x2="745" y2="345" stroke="#4CAF50" stroke-width="2" marker-end="url(#arrowS1)"/>
  <circle cx="745" cy="375" r="28" fill="#232F3E" stroke="#4CAF50" stroke-width="2"/>
  <text x="745" y="380" fill="#FFFFFF" font-size="11" text-anchor="middle">Succeed</text>

  <text x="490" y="20" fill="#8A93A0" font-size="13" text-anchor="middle">Máquina de estados orquestrando Glue Job → validação → decisão → passos paralelos, com tratamento de erro</text>
</svg>
