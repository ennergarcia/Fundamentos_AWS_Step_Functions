<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="300" fill="#0E1B2B"/>

  <defs>
    <marker id="arrowS2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#FF9900"/>
    </marker>
  </defs>

  <!-- StartAt -->
  <rect x="30" y="110" width="160" height="80" rx="10" fill="#232F3E" stroke="#4B90FF" stroke-width="2"/>
  <text x="110" y="140" fill="#FFFFFF" font-size="13" text-anchor="middle">"StartAt"</text>
  <text x="110" y="158" fill="#B0B8C1" font-size="11" text-anchor="middle">aponta pro primeiro</text>
  <text x="110" y="172" fill="#B0B8C1" font-size="11" text-anchor="middle">estado da lista</text>

  <line x1="190" y1="150" x2="260" y2="150" stroke="#FF9900" stroke-width="2" marker-end="url(#arrowS2)"/>

  <!-- States -->
  <rect x="260" y="70" width="200" height="160" rx="10" fill="#232F3E" stroke="#FF9900" stroke-width="3"/>
  <text x="360" y="95" fill="#FFFFFF" font-size="13" text-anchor="middle">"States": { ... }</text>
  <rect x="280" y="105" width="160" height="30" rx="5" fill="#1A2739" stroke="#FF9900" stroke-width="1"/>
  <text x="360" y="125" fill="#B0B8C1" font-size="10" text-anchor="middle">"Type": Task/Choice/Map...</text>
  <rect x="280" y="140" width="160" height="30" rx="5" fill="#1A2739" stroke="#FF9900" stroke-width="1"/>
  <text x="360" y="160" fill="#B0B8C1" font-size="10" text-anchor="middle">"Resource": ARN da Lambda</text>
  <rect x="280" y="175" width="160" height="30" rx="5" fill="#1A2739" stroke="#FF9900" stroke-width="1"/>
  <text x="360" y="195" fill="#B0B8C1" font-size="10" text-anchor="middle">"Next" / "End"</text>

  <line x1="460" y1="150" x2="530" y2="150" stroke="#FF9900" stroke-width="2" marker-end="url(#arrowS2)"/>

  <!-- Retry/Catch -->
  <rect x="530" y="90" width="170" height="60" rx="10" fill="#232F3E" stroke="#E05555" stroke-width="2"/>
  <text x="615" y="115" fill="#FFFFFF" font-size="12" text-anchor="middle">"Retry"</text>
  <text x="615" y="133" fill="#B0B8C1" font-size="10" text-anchor="middle">tenta de novo com backoff</text>

  <rect x="530" y="160" width="170" height="60" rx="10" fill="#232F3E" stroke="#E05555" stroke-width="2"/>
  <text x="615" y="185" fill="#FFFFFF" font-size="12" text-anchor="middle">"Catch"</text>
  <text x="615" y="203" fill="#B0B8C1" font-size="10" text-anchor="middle">redireciona em caso de erro</text>

  <line x1="700" y1="150" x2="760" y2="150" stroke="#FF9900" stroke-width="2" marker-end="url(#arrowS2)"/>

  <!-- Output -->
  <rect x="760" y="110" width="110" height="80" rx="10" fill="#232F3E" stroke="#4CAF50" stroke-width="2"/>
  <text x="815" y="145" fill="#FFFFFF" font-size="12" text-anchor="middle">próximo</text>
  <text x="815" y="163" fill="#B0B8C1" font-size="11" text-anchor="middle">estado</text>

  <text x="450" y="260" fill="#8A93A0" font-size="13" text-anchor="middle">Cada estado é um bloco JSON com tipo, ação e para onde ir a seguir — Retry e Catch cuidam de falhas sem código extra</text>
</svg>
